services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jaliz_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jaliz_web
    # Entrypoint runs as root to chown /app/data, then drops to nextjs for Node.
    user: "0:0"
    restart: always
    ports:
      - "3000:3000" # پورت داخلی برای ارتباط با Nginx (پورت‌های 80 و 443 از اینجا حذف شدند)
    depends_on:
      - api
    volumes:
      # Writable SQLite store (owned by nextjs via entrypoint). Do NOT bind-mount ./prisma here.
      - jaliz_data:/app/data
      # Read-only: copy legacy dev.db into /app/data on first boot if present.
      - ./prisma:/migration/prisma:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - API_URL=http://api:8000
      # تغییر به true چون اکنون پروژه پشت HTTPS و گواهینامه امنیتی قرار دارد
      - COOKIE_SECURE=true

  nginx:
    image: nginx:alpine
    container_name: jaliz_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ۱. متصل کردن فایلی که در مرحله قبل ساختیم به مسیر کانفیگ پیش‌فرض Nginx در داکر
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # ۲. متصل کردن پوشه سرتیفیکیت‌های سرور لینوکس به داخل داکر
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always

volumes:
  jaliz_data:
