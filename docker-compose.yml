services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jaliz_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jaliz_web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./prisma:/app/prisma
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - API_URL=http://api:8000
      # Browsers ignore Secure cookies on http://. Use false for IP:port HTTP; set true behind HTTPS only.
      - COOKIE_SECURE=false
    command: >
      sh -c "npx prisma db push --accept-data-loss && node server.js"

volumes:
  # We use bind mount for sqlite file to make it easily accessible on host
  prisma_data:
