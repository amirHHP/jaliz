services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: jaliz_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jaliz_web
    restart: always
    ports:
      - "3000:3000" # پورت داخلی برای ارتباط با Nginx (پورت‌های 80 و 443 از اینجا حذف شدند)
    depends_on:
      - api
    volumes:
      - ./prisma:/app/prisma
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - API_URL=http://api:8000
      # تغییر به true چون اکنون پروژه پشت HTTPS و گواهینامه امنیتی قرار دارد
      - COOKIE_SECURE=true
    command: >
      sh -c "npx prisma db push --accept-data-loss &&
      touch /app/prisma/dev.db &&
      chmod 664 /app/prisma/dev.db 2>/dev/null || true &&
      node server.js"

  nginx:
    image: nginx:alpine
    container_name: jaliz_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ۱. متصل کردن فایلی که در مرحله قبل ساختیم به مسیر کانفیگ پیش‌فرض Nginx در داکر
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # ۲. متصل کردن پوشه سرتیفیکیت‌های سرور لینوکس به داخل داکر
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always

volumes:
  # لایه ریلیشنال دیتابیس sqlite شما
  prisma_data: