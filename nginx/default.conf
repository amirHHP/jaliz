# ۱. هدایت خودکار ترافیک HTTP (پورت 80) به HTTPS
server {
    listen 80;
    server_name jaliz.noxte.ir;
    return 301 https://$host$request_uri;
}

# ۲. سرور اصلی امن (پورت 443)
server {
    listen 443 ssl;
    http2 on;
    server_name jaliz.noxte.ir;

    client_max_body_size 12M;

    # مسیرهای فایل گواهینامه در داخل کانتینر
    ssl_certificate /etc/letsencrypt/live/jaliz.noxte.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaliz.noxte.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # فشرده‌سازی Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # هدرهای کش برای استاتیک‌های Next.js
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # کش برای فونت‌ها، تصاویر و فایل‌های رسانه‌ای
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        # هدایت ترافیک به کانتینر فرانت‌اند شما
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # اگر بک‌اند (پایتون/api) هم دارید و نیاز است دامنه‌اش جدا شود، می‌توانید این بخش را هم فعال کنید:
    # location /api/ {
    #     proxy_pass http://api:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}