# ۱. هدایت خودکار ترافیک HTTP (پورت 80) به HTTPS
server {
    listen 80;
    server_name jaliz.noxte.ir;
    return 301 https://$host$request_uri;
}

# ۲. سرور اصلی امن (پورت 443)
server {
    listen 443 ssl;
    server_name jaliz.noxte.ir;

    # مسیرهای فایل گواهینامه در داخل کانتینر
    ssl_certificate /etc/letsencrypt/live/jaliz.noxte.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaliz.noxte.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # هدایت ترافیک به کانتینر فرانت‌اند شما
        proxy_pass http://web:3000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # اگر بک‌اند (پایتون/api) هم دارید و نیاز است دامنه‌اش جدا شود، می‌توانید این بخش را هم فعال کنید:
    # location /api/ {
    #     proxy_pass http://api:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}